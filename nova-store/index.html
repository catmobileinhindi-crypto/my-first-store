<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Store — E-Commerce Demo</title>
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --text:#1a1a1a; --muted:#6b6b6b; --border:#e5e5e2;
  --accent:#1f6f54; --accent-hover:#175c45; --accent-light:#e6f2ed;
  --danger:#c0392b; --warn:#b8860b; --ok:#1f6f54; --radius:14px; --shadow:0 2px 10px rgba(0,0,0,.06);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --surface:#1e2025; --text:#eeeeee; --muted:#9a9a9a; --border:#2c2e34;
    --accent:#3ea884; --accent-hover:#4fc199; --accent-light:#1c2e28; --shadow:0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --surface:#1e2025; --text:#eeeeee; --muted:#9a9a9a; --border:#2c2e34;
  --accent:#3ea884; --accent-hover:#4fc199; --accent-light:#1c2e28; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100%;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.hide{display:none!important;}
.container{max-width:1180px;margin:0 auto;padding:0 20px;}

/* NAV */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--border);}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1180px;margin:0 auto;}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:-.5px;color:var(--accent);}
.navlinks{display:flex;gap:22px;align-items:center;}
.navlinks a{font-size:.92rem;font-weight:500;color:var(--muted);padding:6px 2px;border-bottom:2px solid transparent;}
.navlinks a.active,.navlinks a:hover{color:var(--text);border-color:var(--accent);}
.navicons{display:flex;align-items:center;gap:14px;}
.cart-btn{position:relative;background:none;border:none;font-size:1.3rem;color:var(--text);}
.cart-badge{position:absolute;top:-6px;right:-10px;background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;border-radius:20px;padding:1px 6px;}
.burger{display:none;background:none;border:none;font-size:1.4rem;color:var(--text);}
.admin-link{font-size:.8rem;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:20px;}
@media (max-width:800px){
  .navlinks{position:fixed;top:60px;left:0;right:0;background:var(--surface);flex-direction:column;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--border);gap:14px;transform:translateY(-120%);transition:transform .25s;box-shadow:var(--shadow);}
  .navlinks.open{transform:translateY(0);}
  .burger{display:block;}
}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:10px;border:none;font-weight:600;font-size:.9rem;transition:transform .15s,background .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--accent-light);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* HERO */
.hero{background:linear-gradient(135deg,var(--accent-light),var(--bg));padding:60px 20px;text-align:center;}
.hero h1{font-size:2.3rem;margin:0 0 10px;letter-spacing:-1px;}
.hero p{color:var(--muted);max-width:520px;margin:0 auto 22px;}
.badge-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:8px 16px;font-size:.8rem;color:var(--muted);}

/* SECTIONS */
section{padding:40px 20px;}
h2.section-title{font-size:1.4rem;margin:0 0 20px;letter-spacing:-.5px;}
.cat-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.cat-chip{flex:0 0 auto;border:1px solid var(--border);border-radius:30px;padding:8px 16px;font-size:.85rem;background:var(--surface);}
.cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* PRODUCT GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .15s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-3px);}
.card .imgwrap{aspect-ratio:1/1;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:2.4rem;}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card h3{font-size:.95rem;margin:0;font-weight:600;}
.price-row{display:flex;align-items:baseline;gap:8px;}
.price{font-weight:700;color:var(--accent);}
.old-price{text-decoration:line-through;color:var(--muted);font-size:.8rem;}
.stock{font-size:.75rem;color:var(--muted);}
.stock.low{color:var(--warn);}
.stock.out{color:var(--danger);}
.card .actions{margin-top:auto;display:flex;gap:8px;}

/* BANNER */
.banner{background:var(--accent);color:#fff;border-radius:var(--radius);padding:34px 26px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.banner h3{margin:0 0 4px;font-size:1.3rem;}
.banner p{margin:0;opacity:.9;font-size:.9rem;}

footer{border-top:1px solid var(--border);padding:30px 20px;margin-top:20px;color:var(--muted);font-size:.85rem;text-align:center;}

/* PRODUCT DETAIL / MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:700px){.modal-bg{align-items:center;}}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:24px;}
@media(min-width:700px){.modal{border-radius:18px;}}
.modal-close{float:right;background:none;border:none;font-size:1.3rem;color:var(--muted);}
.pd-img{aspect-ratio:1/1;max-width:260px;margin:0 auto 16px;background:var(--accent-light);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:4rem;}
.qty-row{display:flex;align-items:center;gap:10px;margin:14px 0;}
.qty-row button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:1.1rem;}
.qty-row span{min-width:24px;text-align:center;font-weight:600;}

/* CART / CHECKOUT */
.cart-item{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border);padding:12px 0;}
.cart-item .thumb{width:56px;height:56px;border-radius:8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex:0 0 auto;}
.cart-item .info{flex:1;min-width:0;}
.cart-item .info h4{margin:0 0 2px;font-size:.9rem;}
.cart-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.sum-row{display:flex;justify-content:space-between;padding:5px 0;font-size:.9rem;color:var(--muted);}
.sum-row.total{color:var(--text);font-weight:700;font-size:1.05rem;border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:.9rem;font-family:inherit;}
.field{margin-bottom:12px;}
.field.full{grid-column:1/-1;}

.confirm-box{text-align:center;padding:40px 20px;max-width:480px;margin:0 auto;}
.confirm-icon{width:70px;height:70px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 16px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:.85rem;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* ===== ADMIN ===== */
.admin-wrap{display:flex;min-height:100vh;}
.admin-side{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;flex:0 0 auto;}
.admin-side .logo{margin-bottom:24px;display:block;padding:0 6px;}
.admin-side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:.88rem;font-weight:500;margin-bottom:4px;}
.admin-side a.active,.admin-side a:hover{background:var(--accent-light);color:var(--accent);}
.admin-main{flex:1;padding:24px;min-width:0;}
@media(max-width:800px){
  .admin-wrap{flex-direction:column;}
  .admin-side{width:100%;display:flex;overflow-x:auto;gap:4px;padding:10px;border-right:none;border-bottom:1px solid var(--border);}
  .admin-side .logo{display:none;}
  .admin-side a{white-space:nowrap;margin-bottom:0;}
}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-card .n{font-size:1.5rem;font-weight:800;}
.stat-card .l{font-size:.78rem;color:var(--muted);}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:640px;}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;}
.status-tag{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
.st-New{background:#e0e8ff;color:#2a3fb0;}
.st-Confirmed{background:#e6f2ed;color:#1f6f54;}
.st-Processing{background:#fff3d6;color:#b8860b;}
.st-Shipped{background:#e0f0ff;color:#1a6faa;}
.st-Delivered{background:#dff5e2;color:#1f7a2e;}
.st-Cancelled{background:#fde3e0;color:#c0392b;}
.admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;width:100%;max-width:360px;}
.hint{font-size:.76rem;color:var(--muted);margin-top:10px;text-align:center;}
.section-block{margin-bottom:26px;}
.action-icons{display:flex;gap:6px;}
.action-icons button{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.78rem;}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============ DATA LAYER (localStorage = "database") ============ */
const DB_KEY = "novastore_db_v1";
function seedData(){
  return {
    admin: { user: "admin", pass: "demo123" },
    session: null,
    categories: ["Apparel","Footwear","Electronics","Accessories"],
    products: [
      {id:"p1",name:"Premium Hoodie",desc:"Soft fleece-lined hoodie, unisex fit, breathable cotton blend. Perfect for everyday wear.",price:4499,salePrice:3799,category:"Apparel",stock:24,emoji:"🧥",published:true},
      {id:"p2",name:"Smart Watch",desc:"Fitness tracking, heart-rate monitor, 7-day battery, waterproof design.",price:8999,salePrice:0,category:"Electronics",stock:12,emoji:"⌚",published:true},
      {id:"p3",name:"Running Shoes",desc:"Lightweight cushioned sole built for daily runs and long-distance comfort.",price:5999,salePrice:4999,category:"Footwear",stock:8,emoji:"👟",published:true},
      {id:"p4",name:"Wireless Earbuds",desc:"Active noise cancellation, 24hr battery with case, crystal clear calls.",price:3299,salePrice:0,category:"Electronics",stock:30,emoji:"🎧",published:true},
      {id:"p5",name:"Travel Backpack",desc:"Water-resistant 30L backpack with laptop sleeve and multiple compartments.",price:2799,salePrice:0,category:"Accessories",stock:3,emoji:"🎒",published:true},
      {id:"p6",name:"Premium T-Shirt",desc:"100% combed cotton, pre-shrunk, available in classic fit.",price:1499,salePrice:1199,category:"Apparel",stock:0,emoji:"👕",published:true},
    ],
    orders: [],
    customers: [],
    cart: []
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) throw new Error("empty");
    return JSON.parse(raw);
  }catch(e){
    const fresh = seedData();
    localStorage.setItem(DB_KEY, JSON.stringify(fresh));
    return fresh;
  }
}
let db = loadDB();
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function fmt(n){ return "Rs " + Number(n).toLocaleString(); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window._tt);
  window._tt = setTimeout(()=>t.classList.remove("show"), 2000);
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8).toUpperCase(); }

/* ============ ROUTER ============ */
function route(){ return location.hash.slice(1) || "/shop"; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function nav(path){ location.hash = path; }

/* ============ MAIN RENDER ============ */
function render(){
  const r = route();
  const app = document.getElementById("app");
  if(r.startsWith("/admin")){
    app.innerHTML = renderAdmin(r);
    bindAdminEvents();
  } else {
    app.innerHTML = renderSite(r);
    bindSiteEvents();
  }
  window.scrollTo(0,0);
}

/* ============ CUSTOMER SITE ============ */
function siteHeader(active){
  const cartCount = db.cart.reduce((s,i)=>s+i.qty,0);
  const links = [["shop","Shop"],["about","About"],["contact","Contact"]];
  return `
  <header class="site">
    <div class="navbar">
      <a href="#/shop" class="logo">Nova Store</a>
      <nav class="navlinks" id="navlinks">
        ${links.map(([p,l])=>`<a href="#/${p}" class="${active===p?'active':''}">${l}</a>`).join("")}
      </nav>
      <div class="navicons">
        <button class="cart-btn" onclick="nav('/cart')">🛒${cartCount?`<span class="cart-badge">${cartCount}</span>`:""}</button>
        <button class="burger" onclick="document.getElementById('navlinks').classList.toggle('open')">☰</button>
      </div>
    </div>
  </header>`;
}
function siteFooter(){
  return `<footer>© 2026 Nova Store — Demo storefront built for testing purposes. All data is stored locally in your browser.</footer>`;
}
function productCard(p){
  const stockClass = p.stock===0?"out":p.stock<=5?"low":"";
  const stockText = p.stock===0?"Out of stock":p.stock<=5?`Only ${p.stock} left`:`${p.stock} in stock`;
  const price = p.salePrice>0 ? p.salePrice : p.price;
  return `
  <div class="card">
    <a href="#/product/${p.id}" class="imgwrap">${p.emoji}</a>
    <div class="body">
      <h3><a href="#/product/${p.id}">${p.name}</a></h3>
      <div class="price-row">
        <span class="price">${fmt(price)}</span>
        ${p.salePrice>0?`<span class="old-price">${fmt(p.price)}</span>`:""}
      </div>
      <span class="stock ${stockClass}">${stockText}</span>
      <div class="actions">
        <button class="btn btn-primary btn-sm" style="flex:1" ${p.stock===0?"disabled":""} onclick="quickAdd('${p.id}')">Add to Cart</button>
      </div>
    </div>
  </div>`;
}
function renderSite(r){
  const activeProducts = db.products.filter(p=>p.published);
  if(r==="/shop" || r==="/"){
    const featured = activeProducts.slice(0,4);
    return siteHeader("shop") + `
    <div class="hero">
      <h1>Gear up for everyday life</h1>
      <p>Premium apparel, footwear & tech — carefully picked, honestly priced.</p>
      <a href="#/products" class="btn btn-primary">Shop Now</a>
      <div class="badge-row">
        <span class="pill">🚚 Cash on Delivery</span>
        <span class="pill">↩️ Easy Returns</span>
        <span class="pill">⭐ 4.8/5 Rated</span>
      </div>
    </div>
    <div class="container">
      <section>
        <h2 class="section-title">Featured Products</h2>
        <div class="grid">${featured.map(productCard).join("")}</div>
      </section>
      <section>
        <h2 class="section-title">Categories</h2>
        <div class="cat-row">${db.categories.map(c=>`<a href="#/products?cat=${encodeURIComponent(c)}" class="cat-chip">${c}</a>`).join("")}</div>
      </section>
      <section>
        <div class="banner">
          <div><h3>Free shipping this week</h3><p>On all orders over Rs 3,000 — no code needed.</p></div>
          <a href="#/products" class="btn" style="background:#fff;color:var(--accent)">Browse All</a>
        </div>
      </section>
    </div>
    ` + siteFooter();
  }
  if(r.startsWith("/products")){
    const params = new URLSearchParams(r.split("?")[1]||"");
    const cat = params.get("cat");
    const list = cat ? activeProducts.filter(p=>p.category===cat) : activeProducts;
    return siteHeader("shop") + `
    <div class="container">
      <section>
        <h2 class="section-title">${cat?cat:"All Products"}</h2>
        <div class="cat-row">
          <a href="#/products" class="cat-chip ${!cat?'active':''}">All</a>
          ${db.categories.map(c=>`<a href="#/products?cat=${encodeURIComponent(c)}" class="cat-chip ${cat===c?'active':''}">${c}</a>`).join("")}
        </div>
      </section>
      <section>
        ${list.length?`<div class="grid">${list.map(productCard).join("")}</div>`:`<div class="empty">No products in this category yet.</div>`}
      </section>
    </div>` + siteFooter();
  }
  if(r.startsWith("/product/")){
    const id = r.split("/product/")[1];
    const p = db.products.find(x=>x.id===id);
    if(!p) return siteHeader("shop")+`<div class="empty">Product not found.</div>`+siteFooter();
    const price = p.salePrice>0?p.salePrice:p.price;
    return siteHeader("shop") + `
    <div class="container" style="max-width:900px;padding-top:30px;">
      <a href="#/products" class="btn btn-outline btn-sm" style="margin-bottom:18px;">← Back to Shop</a>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;" class="pd-grid">
        <div class="pd-img" style="max-width:100%;aspect-ratio:1/1;">${p.emoji}</div>
        <div>
          <h1 style="margin:0 0 8px;font-size:1.6rem;">${p.name}</h1>
          <div class="price-row" style="margin-bottom:10px;">
            <span class="price" style="font-size:1.4rem;">${fmt(price)}</span>
            ${p.salePrice>0?`<span class="old-price">${fmt(p.price)}</span>`:""}
          </div>
          <span class="stock ${p.stock===0?'out':p.stock<=5?'low':''}">${p.stock===0?"Out of stock":p.stock+" in stock"}</span>
          <p style="color:var(--muted);line-height:1.6;margin:16px 0;">${p.desc}</p>
          <div class="qty-row">
            <button onclick="changeQty(-1)">−</button><span id="pdQty">1</span><button onclick="changeQty(1)">+</button>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-outline" ${p.stock===0?"disabled":""} onclick="addToCart('${p.id}', getQty())">Add to Cart</button>
            <button class="btn btn-primary" ${p.stock===0?"disabled":""} onclick="buyNow('${p.id}', getQty())">Buy Now</button>
          </div>
        </div>
      </div>
    </div>
    <style>@media(max-width:700px){.pd-grid{grid-template-columns:1fr!important;}}</style>
    ` + siteFooter();
  }
  if(r==="/cart"){
    if(db.cart.length===0) return siteHeader("shop")+`<div class="container"><div class="empty"><h2>Your cart is empty</h2><p>Add some products to get started.</p><a href="#/products" class="btn btn-primary">Browse Products</a></div></div>`+siteFooter();
    let subtotal = 0;
    const items = db.cart.map(ci=>{
      const p = db.products.find(x=>x.id===ci.id);
      const price = p.salePrice>0?p.salePrice:p.price;
      subtotal += price*ci.qty;
      return `<div class="cart-item">
        <div class="thumb">${p.emoji}</div>
        <div class="info"><h4>${p.name}</h4><span style="color:var(--muted);font-size:.85rem;">${fmt(price)} × ${ci.qty}</span></div>
        <div class="qty-row" style="margin:0;">
          <button onclick="updateCartQty('${p.id}',-1)">−</button><span>${ci.qty}</span><button onclick="updateCartQty('${p.id}',1)">+</button>
        </div>
        <button class="btn btn-sm btn-outline" onclick="removeFromCart('${p.id}')">✕</button>
      </div>`;
    }).join("");
    return siteHeader("shop")+`
    <div class="container" style="max-width:700px;padding-top:30px;">
      <h2 class="section-title">Your Cart</h2>
      ${items}
      <div class="cart-summary" style="margin-top:20px;">
        <div class="sum-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        <div class="sum-row"><span>Delivery</span><span>${subtotal>3000?"Free":fmt(150)}</span></div>
        <div class="sum-row total"><span>Total</span><span>${fmt(subtotal>3000?subtotal:subtotal+150)}</span></div>
        <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="nav('/checkout')">Proceed to Checkout</button>
      </div>
    </div>` + siteFooter();
  }
  if(r==="/checkout"){
    if(db.cart.length===0) return siteHeader("shop")+`<div class="empty">Your cart is empty.</div>`+siteFooter();
    let subtotal=0;
    db.cart.forEach(ci=>{const p=db.products.find(x=>x.id===ci.id);subtotal += (p.salePrice>0?p.salePrice:p.price)*ci.qty;});
    const delivery = subtotal>3000?0:150;
    return siteHeader("shop")+`
    <div class="container" style="max-width:640px;padding-top:30px;">
      <h2 class="section-title">Checkout</h2>
      <form id="checkoutForm">
        <div class="form-grid">
          <div class="field"><label>Full Name *</label><input required name="name"></div>
          <div class="field"><label>Phone Number *</label><input required name="phone" type="tel"></div>
          <div class="field full"><label>Email (optional)</label><input name="email" type="email"></div>
          <div class="field full"><label>Delivery Address *</label><textarea required name="address" rows="2"></textarea></div>
          <div class="field"><label>City *</label><input required name="city"></div>
        </div>
        <div class="cart-summary" style="margin:16px 0;">
          <div class="sum-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
          <div class="sum-row"><span>Delivery</span><span>${delivery?fmt(delivery):"Free"}</span></div>
          <div class="sum-row total"><span>Total</span><span>${fmt(subtotal+delivery)}</span></div>
          <div class="sum-row"><span>Payment</span><span>Cash on Delivery</span></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Place Order</button>
      </form>
    </div>` + siteFooter();
  }
  if(r.startsWith("/confirm/")){
    const id = r.split("/confirm/")[1];
    const o = db.orders.find(x=>x.id===id);
    if(!o) return siteHeader("shop")+`<div class="empty">Order not found.</div>`+siteFooter();
    return siteHeader("shop")+`
    <div class="container"><div class="confirm-box">
      <div class="confirm-icon">✓</div>
      <h2>Order Placed Successfully!</h2>
      <p style="color:var(--muted);">Thank you, ${o.name}. Your order has been received.</p>
      <div class="cart-summary" style="text-align:left;margin-top:20px;">
        <div class="sum-row"><span>Order ID</span><span>${o.id}</span></div>
        <div class="sum-row"><span>Status</span><span class="status-tag st-${o.status}">${o.status}</span></div>
        ${o.items.map(i=>`<div class="sum-row"><span>${i.name} × ${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join("")}
        <div class="sum-row total"><span>Total</span><span>${fmt(o.total)}</span></div>
      </div>
      <a href="#/shop" class="btn btn-primary" style="margin-top:20px;">Continue Shopping</a>
    </div></div>` + siteFooter();
  }
  if(r==="/about"){
    return siteHeader("about")+`<div class="container" style="max-width:700px;padding-top:30px;">
    <h2 class="section-title">About Nova Store</h2>
    <p style="color:var(--muted);line-height:1.7;">Nova Store is a demo e-commerce experience built to showcase a complete storefront-to-admin workflow — product browsing, cart, checkout, and order management, all connected in real time. This is a demo project; no real payments are processed.</p>
    </div>` + siteFooter();
  }
  if(r==="/contact"){
    return siteHeader("contact")+`<div class="container" style="max-width:500px;padding-top:30px;">
    <h2 class="section-title">Contact Us</h2>
    <div class="field"><label>Your Name</label><input></div>
    <div class="field"><label>Message</label><textarea rows="4"></textarea></div>
    <button class="btn btn-primary" onclick="toast('Message sent (demo)')">Send Message</button>
    </div>` + siteFooter();
  }
  return siteHeader("shop")+`<div class="empty">Page not found.</div>`+siteFooter();
}

function getQty(){ return parseInt(document.getElementById("pdQty")?.textContent||"1"); }
function changeQty(d){
  const el = document.getElementById("pdQty");
  let v = parseInt(el.textContent)+d;
  if(v<1) v=1;
  el.textContent = v;
}
function quickAdd(id){ addToCart(id,1); }
function addToCart(id, qty){
  const p = db.products.find(x=>x.id===id);
  if(!p || p.stock<=0) return;
  const existing = db.cart.find(c=>c.id===id);
  const currentQty = existing ? existing.qty : 0;
  if(currentQty+qty > p.stock){ toast(`Only ${p.stock} in stock`); return; }
  if(existing) existing.qty += qty; else db.cart.push({id,qty});
  save(); toast("Added to cart"); render();
}
function buyNow(id, qty){ addToCart(id, qty); nav('/cart'); }
function updateCartQty(id, delta){
  const ci = db.cart.find(c=>c.id===id);
  const p = db.products.find(x=>x.id===id);
  if(!ci) return;
  ci.qty += delta;
  if(ci.qty > p.stock){ ci.qty = p.stock; toast("Max stock reached"); }
  if(ci.qty<=0) db.cart = db.cart.filter(c=>c.id!==id);
  save(); render();
}
function removeFromCart(id){ db.cart = db.cart.filter(c=>c.id!==id); save(); render(); }

function bindSiteEvents(){
  const cf = document.getElementById("checkoutForm");
  if(cf){
    cf.addEventListener("submit", e=>{
      e.preventDefault();
      const fd = new FormData(cf);
      const name = fd.get("name"), phone = fd.get("phone"), email = fd.get("email"), address = fd.get("address"), city = fd.get("city");
      // stock check
      for(const ci of db.cart){
        const p = db.products.find(x=>x.id===ci.id);
        if(!p || p.stock < ci.qty){ toast(`${p?p.name:'Item'} is out of stock`); return; }
      }
      let subtotal=0;
      const items = db.cart.map(ci=>{
        const p = db.products.find(x=>x.id===ci.id);
        const price = p.salePrice>0?p.salePrice:p.price;
        subtotal += price*ci.qty;
        p.stock -= ci.qty; // decrease stock
        return {id:p.id,name:p.name,price,qty:ci.qty};
      });
      const delivery = subtotal>3000?0:150;
      const order = {
        id: uid("ORD-"),
        name, phone, email: email||"", address, city,
        items, total: subtotal+delivery, delivery,
        status: "New",
        date: new Date().toISOString()
      };
      db.orders.unshift(order);
      // upsert customer
      let cust = db.customers.find(c=>c.phone===phone);
      if(!cust){ cust = {phone,name,email:email||"",address,city,orders:0,spent:0}; db.customers.push(cust); }
      cust.orders += 1; cust.spent += order.total; cust.name=name; cust.address=address; cust.city=city;
      db.cart = [];
      save();
      nav('/confirm/'+order.id);
    });
  }
}

/* ============ ADMIN ============ */
function isLoggedIn(){ return db.session === "admin"; }
function renderAdmin(r){
  if(!isLoggedIn()){
    return `
    <div class="admin-login">
      <div class="login-card">
        <div class="logo" style="text-align:center;margin-bottom:18px;">Nova Store <span style="color:var(--muted);font-weight:400;font-size:.9rem;">Admin</span></div>
        <form id="loginForm">
          <div class="field"><label>Username</label><input name="user" required></div>
          <div class="field"><label>Password</label><input name="pass" type="password" required></div>
          <button class="btn btn-primary btn-block">Log In</button>
        </form>
        <p class="hint">Demo credentials — user: <b>admin</b> / pass: <b>demo123</b></p>
        <p class="hint"><a href="#/shop">← Back to store</a></p>
      </div>
    </div>`;
  }
  const page = r.split("/admin")[1].replace(/^\//,"").split("?")[0] || "dashboard";
  return `<div class="admin-wrap">
    ${adminSidebar(page)}
    <div class="admin-main">${adminPage(page)}</div>
  </div>`;
}
function adminSidebar(active){
  const items = [["dashboard","📊 Dashboard"],["products","📦 Products"],["orders","🧾 Orders"],["customers","👥 Customers"],["settings","⚙️ Settings"]];
  return `<div class="admin-side">
    <a href="#/shop" class="logo">Nova Store</a>
    ${items.map(([p,l])=>`<a href="#/admin/${p}" class="${active===p?'active':''}">${l}</a>`).join("")}
    <a href="#" onclick="adminLogout();return false;" style="color:var(--danger);margin-top:10px;">🚪 Logout</a>
  </div>`;
}
function adminLogout(){ db.session=null; save(); nav('/admin'); }

function adminPage(page){
  if(page==="dashboard") return adminDashboard();
  if(page==="products") return adminProducts();
  if(page==="orders") return adminOrders();
  if(page==="customers") return adminCustomers();
  if(page==="settings") return adminSettings();
  return "Not found";
}
function adminDashboard(){
  const totalProducts = db.products.length;
  const totalOrders = db.orders.length;
  const newOrders = db.orders.filter(o=>o.status==="New").length;
  const confirmed = db.orders.filter(o=>o.status==="Confirmed").length;
  const delivered = db.orders.filter(o=>o.status==="Delivered").length;
  const totalSales = db.orders.filter(o=>o.status!=="Cancelled").reduce((s,o)=>s+o.total,0);
  const lowStock = db.products.filter(p=>p.stock>0 && p.stock<=5).length;
  const cards = [
    ["Total Products",totalProducts],["Total Orders",totalOrders],["New Orders",newOrders],
    ["Confirmed",confirmed],["Delivered",delivered],["Total Sales",fmt(totalSales)],["Low Stock",lowStock]
  ];
  const recent = db.orders.slice(0,5);
  return `
  <div class="admin-topbar"><h2 style="margin:0;">Dashboard</h2></div>
  <div class="stat-grid">${cards.map(([l,n])=>`<div class="stat-card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
  <div class="section-block">
    <h3 style="margin-bottom:10px;">Recent Orders</h3>
    <div class="table-wrap"><table>
      <tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr>
      ${recent.length?recent.map(o=>`<tr><td>${o.id}</td><td>${o.name}</td><td>${fmt(o.total)}</td><td><span class="status-tag st-${o.status}">${o.status}</span></td><td>${new Date(o.date).toLocaleDateString()}</td></tr>`).join(""):`<tr><td colspan="5" style="text-align:center;color:var(--muted);">No orders yet</td></tr>`}
    </table></div>
  </div>`;
}
function adminProducts(){
  return `
  <div class="admin-topbar"><h2 style="margin:0;">Products</h2><button class="btn btn-primary btn-sm" onclick="openProductForm()">+ Add Product</button></div>
  <div id="productFormWrap"></div>
  <div class="table-wrap"><table>
    <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Published</th><th>Actions</th></tr>
    ${db.products.map(p=>`<tr>
      <td>${p.emoji} ${p.name}</td><td>${p.category}</td><td>${fmt(p.salePrice>0?p.salePrice:p.price)}</td>
      <td>${p.stock}</td><td>${p.published?"✅":"❌"}</td>
      <td class="action-icons">
        <button onclick="openProductForm('${p.id}')">Edit</button>
        <button onclick="togglePublish('${p.id}')">${p.published?"Unpublish":"Publish"}</button>
        <button onclick="deleteProduct('${p.id}')" style="color:var(--danger);">Delete</button>
      </td>
    </tr>`).join("")}
  </table></div>`;
}
function productFormHTML(p){
  return `
  <div class="cart-summary" style="margin-bottom:20px;">
    <h3 style="margin-top:0;">${p?"Edit Product":"Add Product"}</h3>
    <form id="prodForm">
      <input type="hidden" name="id" value="${p?p.id:''}">
      <div class="form-grid">
        <div class="field"><label>Product Name *</label><input name="name" required value="${p?p.name:''}"></div>
        <div class="field"><label>Category *</label>
          <select name="category">${db.categories.map(c=>`<option ${p&&p.category===c?'selected':''}>${c}</option>`).join("")}</select>
        </div>
        <div class="field full"><label>Description</label><textarea name="desc" rows="2">${p?p.desc:''}</textarea></div>
        <div class="field"><label>Price (Rs) *</label><input name="price" type="number" required value="${p?p.price:''}"></div>
        <div class="field"><label>Sale Price (optional)</label><input name="salePrice" type="number" value="${p?p.salePrice:0}"></div>
        <div class="field"><label>Stock Quantity *</label><input name="stock" type="number" required value="${p?p.stock:0}"></div>
        <div class="field"><label>Emoji Image (placeholder) *</label><input name="emoji" required value="${p?p.emoji:'📦'}" maxlength="2"></div>
        <div class="field full"><label><input type="checkbox" name="published" style="width:auto;" ${(!p||p.published)?'checked':''}> Published (visible on Shop)</label></div>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">${p?"Save Changes":"Add Product"}</button>
        <button type="button" class="btn btn-outline" onclick="closeProductForm()">Cancel</button>
      </div>
    </form>
  </div>`;
}
function openProductForm(id){
  const p = id ? db.products.find(x=>x.id===id) : null;
  document.getElementById("productFormWrap").innerHTML = productFormHTML(p);
  bindProductForm();
}
function closeProductForm(){ document.getElementById("productFormWrap").innerHTML=""; }
function bindProductForm(){
  const f = document.getElementById("prodForm");
  if(!f) return;
  f.addEventListener("submit", e=>{
    e.preventDefault();
    const fd = new FormData(f);
    const id = fd.get("id");
    const data = {
      name: fd.get("name"), desc: fd.get("desc"), category: fd.get("category"),
      price: Number(fd.get("price")), salePrice: Number(fd.get("salePrice"))||0,
      stock: Number(fd.get("stock")), emoji: fd.get("emoji")||"📦",
      published: fd.get("published")==="on"
    };
    if(id){
      const p = db.products.find(x=>x.id===id);
      Object.assign(p, data);
      toast("Product updated");
    } else {
      db.products.push({id:uid("p"), ...data});
      toast("Product added");
    }
    save(); render();
  });
}
function togglePublish(id){ const p=db.products.find(x=>x.id===id); p.published=!p.published; save(); render(); }
function deleteProduct(id){ if(!confirm("Delete this product?")) return; db.products=db.products.filter(x=>x.id!==id); save(); render(); }

function adminOrders(){
  const statuses = ["New","Confirmed","Processing","Shipped","Delivered","Cancelled"];
  return `
  <div class="admin-topbar"><h2 style="margin:0;">Orders</h2></div>
  <div class="table-wrap"><table>
    <tr><th>Order ID</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th></tr>
    ${db.orders.length?db.orders.map(o=>`<tr>
      <td>${o.id}</td><td>${o.name}</td><td>${o.phone}</td><td>${o.address}, ${o.city}</td>
      <td>${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</td><td>${fmt(o.total)}</td>
      <td>${new Date(o.date).toLocaleDateString()}</td>
      <td><select onchange="updateOrderStatus('${o.id}',this.value)">
        ${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join("")}
      </select></td>
    </tr>`).join(""):`<tr><td colspan="8" style="text-align:center;color:var(--muted);">No orders yet</td></tr>`}
  </table></div>`;
}
function updateOrderStatus(id, status){
  const o = db.orders.find(x=>x.id===id);
  o.status = status; save(); toast("Order status updated"); render();
}
function adminCustomers(){
  return `
  <div class="admin-topbar"><h2 style="margin:0;">Customers</h2></div>
  <div class="table-wrap"><table>
    <tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Orders</th><th>Total Spent</th></tr>
    ${db.customers.length?db.customers.map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.email||'-'}</td><td>${c.address}, ${c.city}</td><td>${c.orders}</td><td>${fmt(c.spent)}</td></tr>`).join(""):`<tr><td colspan="6" style="text-align:center;color:var(--muted);">No customers yet</td></tr>`}
  </table></div>`;
}
function adminSettings(){
  return `
  <div class="admin-topbar"><h2 style="margin:0;">Settings</h2></div>
  <div class="cart-summary" style="max-width:420px;">
    <p style="color:var(--muted);font-size:.85rem;line-height:1.6;">This is a demo admin account. In production, connect real authentication (e.g. hashed passwords + sessions/JWT stored server-side) rather than the in-browser demo login used here.</p>
    <button class="btn btn-outline" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem('${DB_KEY}');db=loadDB();render();toast('Data reset');}">Reset Demo Data</button>
  </div>`;
}
function bindAdminEvents(){
  const lf = document.getElementById("loginForm");
  if(lf){
    lf.addEventListener("submit", e=>{
      e.preventDefault();
      const fd = new FormData(lf);
      if(fd.get("user")===db.admin.user && fd.get("pass")===db.admin.pass){
        db.session="admin"; save(); nav('/admin/dashboard');
      } else { toast("Invalid credentials"); }
